<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#F5F5F5;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:20px 0}
.wrap{position:relative;width:1055px;height:560px}
svg{width:100%;height:100%;display:block}
.mod-hit{cursor:pointer}
.mod-bg{transition:filter .25s ease}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:6px 18px;border-radius:16px;font-size:12px;pointer-events:none;opacity:.75;font-family:-apple-system,BlinkMacSystemFont,sans-serif;white-space:nowrap}
.fl{stroke-dasharray:200 60;stroke-dashoffset:0}
.panel{width:fit-content;min-width:460px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-top:12px;padding:16px 20px 12px;font-family:Poppins,sans-serif}
.panel-title{font-size:14px;font-weight:600;color:rgba(0,0,0,.85);margin-bottom:10px}
.s-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.s-row:last-child{margin-bottom:0}
.s-label{width:80px;font-size:12px;color:#666;flex-shrink:0}
.slider-wrap{position:relative;width:220px;display:inline-flex;align-items:center}
.center-mark{position:absolute;left:50%;width:1px;height:12px;background:#999;pointer-events:none;z-index:1;border-radius:1px}
.s-slider{width:100%;height:6px;-webkit-appearance:none;appearance:none;background:#E0E0E0;border-radius:3px;outline:none}
.s-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#16AAAF;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.s-val{font-size:11px;color:#999;text-align:left;white-space:nowrap;min-width:120px}
.s-input{width:52px;border:none;border-bottom:1px solid #ddd;font-size:13px;font-weight:600;color:#000;text-align:center;outline:none;font-family:Poppins,sans-serif;padding:0 2px;background:transparent}
.s-input:focus{border-bottom-color:#16AAAF}
</style>

  R2:[{g:'fg-mid-r',d:'lr'},{g:'fg-mid-l',d:'rl'},{g:'fg-bot-l',d:'rl'},{g:'fg-top-r',d:'rl'},{g:'fg-bot-r',d:'rl'}],
  R3:[]
};

var pathGroupToModule={'fg-top-l':'L1','fg-mid-l':'L2','fg-bot-l':'L3','fg-top-r':'R1','fg-mid-r':'R2','fg-bot-r':'R3'};
var allModules=['L1','L2','L3','R1','R2','R3'];

function dimInactive(activeIds){
  allModules.forEach(function(mid){
    var card=document.querySelector('.card[data-card="'+mid+'"]');
    if(!card) return;
    var isActive=activeIds.indexOf(mid)>-1;
    card.setAttribute('opacity',isActive?'1':'0.5');
    var bg=card.querySelector('.mod-bg');
    if(bg) bg.setAttribute('fill',isActive?'white':'#FAFAFA');
  });
}
function restoreOpacity(){
  allModules.forEach(function(mid){
    var card=document.querySelector('.card[data-card="'+mid+'"]');
    if(!card) return;
    card.setAttribute('opacity','1');
    var bg=card.querySelector('.mod-bg');
    if(bg) bg.setAttribute('fill','white');
  });
}

function findBg(mid){
  for(var i=0;i<bgRects.length;i++)
    if(bgRects[i].getAttribute('data-module')===mid) return bgRects[i];
  return null;
}

function getGrad(g,d){
  var parts=g.split('-');
  var useRl=(parts[2]==='l')!==(d==='lr');
  return 'flow-grad-'+parts[1]+(useRl?'-rl':'');
}

function updateGlowColor(hex){
  var r=parseInt(hex.slice(1,3),16)/255;
  var g=parseInt(hex.slice(3,5),16)/255;
  var b=parseInt(hex.slice(5,7),16)/255;
  var val='0 0 0 0 '+r+'  0 0 0 0 '+g+'  0 0 0 0 '+b+'  0 0 0 0.5 0';
  var f1=document.getElementById('flow-glow');
  var f2=document.getElementById('flow-glow-mid');
  if(f1){var cm1=f1.querySelector('feColorMatrix');if(cm1)cm1.setAttribute('values',val);}
  if(f2){var cm2=f2.querySelector('feColorMatrix');if(cm2)cm2.setAttribute('values',val);}
}

function getGlowFilterId(hex,isMid){
  var id='glow-'+hex.slice(1)+(isMid?'-m':'');
  if(document.getElementById(id)) return id;
  var r=parseInt(hex.slice(1,3),16)/255;
  var g=parseInt(hex.slice(3,5),16)/255;
  var b=parseInt(hex.slice(5,7),16)/255;
  var val='0 0 0 0 '+r+'  0 0 0 0 '+g+'  0 0 0 0 '+b+'  0 0 0 0.5 0';
  var ns='http://www.w3.org/2000/svg';
  var defs=document.querySelector('svg defs');
  var f=document.createElementNS(ns,'filter');
  f.setAttribute('id',id);
  if(isMid){f.setAttribute('x','320');f.setAttribute('y','285');f.setAttribute('width','380');f.setAttribute('height','52');f.setAttribute('filterUnits','userSpaceOnUse');}
  else{f.setAttribute('x','-10%');f.setAttribute('y','-50%');f.setAttribute('width','120%');f.setAttribute('height','200%');}
  var bl=document.createElementNS(ns,'feGaussianBlur');bl.setAttribute('in','SourceGraphic');bl.setAttribute('stdDeviation','4');bl.setAttribute('result','blur');
  var cm=document.createElementNS(ns,'feColorMatrix');cm.setAttribute('in','blur');cm.setAttribute('type','matrix');cm.setAttribute('values',val);cm.setAttribute('result','glow');
  var mg=document.createElementNS(ns,'feMerge');
  var m1=document.createElementNS(ns,'feMergeNode');m1.setAttribute('in','glow');
  var m2=document.createElementNS(ns,'feMergeNode');m2.setAttribute('in','SourceGraphic');
  mg.appendChild(m1);mg.appendChild(m2);
  f.appendChild(bl);f.appendChild(cm);f.appendChild(mg);
  defs.appendChild(f);
  return id;
}

function runConsumerCycle(mid){
  if(moduleData[mid]===0) return;
  var flows=consumerFlows[mid];
  if(!flows||!flows.length) return;
  // 过滤掉数值为0或负数的供电方（供电方必须为正数）
  flows=flows.filter(function(f){return moduleData[f.prov]>0;});
  if(!flows.length) return;
  activeFlows.forEach(function(f){if(f.anim)f.anim.pause();});
  activeFlows=[];
  clonedEls.forEach(function(el){if(el.parentNode)el.parentNode.removeChild(el);});
  clonedEls=[];

  var cG=flows[0].cPath.g;
  var cGrp=groups[cG];
  var cFl=cGrp.querySelector('.fl');
  var L_c=cFl.getTotalLength();
  var cTravel=Math.ceil((L_c+2*D)/SPD);

  // 汇聚后的消费路径颜色：单供电方用供电方颜色，多供电方用紫色
  var consumerColor=flows.length===1?providerColors[flows[0].prov]:'#794EAD';
  cGrp.setAttribute('opacity','1');
  cFl.setAttribute('stroke',consumerColor);
  cFl.setAttribute('stroke-opacity','0.6');
  cFl.setAttribute('stroke-width','4');
  cFl.setAttribute('filter','url(#'+getGlowFilterId(consumerColor,cG.indexOf('mid')>-1)+')');
  cFl.style.strokeDasharray=D+' 99999';
  cFl.style.strokeDashoffset=-(L_c+D);

  var maxPEnd=0;
  var minArrival=Infinity;
  flows.forEach(function(flow){
    var color=providerColors[flow.prov];
    var pG=flow.pPath.g;
    var pGrp=groups[pG];
    if(!pGrp) return;
    var pFl=pGrp.querySelector('.fl');
    pGrp.setAttribute('opacity','1');
    pFl.setAttribute('stroke',color);
    pFl.setAttribute('stroke-opacity','0.6');
    pFl.setAttribute('stroke-width','4');
    pFl.setAttribute('filter','url(#'+getGlowFilterId(color,pG.indexOf('mid')>-1)+')');
    pFl.style.strokeDasharray=D+' 99999';
    var L_p=pFl.getTotalLength();
    var pTravel=Math.ceil((L_p+2*D)/SPD);
    pFl.style.strokeDashoffset=D;
    activeFlows.push({el:pFl,anim:anime({targets:pFl,strokeDashoffset:-(L_p+D),duration:pTravel,easing:'linear'})});
    if(pTravel>maxPEnd) maxPEnd=pTravel;
    var arrival=Math.max(0,(L_p-D)/SPD-40);
    if(arrival<minArrival) minArrival=arrival;
  });

  // 消费路径延迟 = 最快的供电方到达中心的时刻
  var cDelay=Math.round(minArrival);
  activeFlows.push({el:cFl,anim:anime({targets:cFl,strokeDashoffset:D,duration:cTravel,delay:cDelay,easing:'linear'})});

  var totalEnd=cDelay+cTravel;
  if(maxPEnd>totalEnd) totalEnd=maxPEnd;
  var tid=setTimeout(function(){runConsumerCycle(mid);},totalEnd+10);
  pendingTimers.push(tid);
}

function setupPath(p){
  var grp=groups[p.g]; if(!grp) return null;
  var fl=grp.querySelector('.fl');
  grp.setAttribute('opacity','1');
  fl.setAttribute('stroke',currentColor);
  fl.setAttribute('stroke-opacity','0.6');
  fl.setAttribute('stroke-width','4');
  fl.setAttribute('filter','url(#'+(p.g.indexOf('mid')>-1?'flow-glow-mid':'flow-glow')+')');
  fl.style.strokeDasharray=D+' 99999';
  return fl;
}

function stopAllFlows(){
  pendingTimers.forEach(function(t){clearTimeout(t);});
  pendingTimers=[];
  activeFlows.forEach(function(f){
    if(f.anim) f.anim.pause();
    f.el.style.strokeDashoffset='0';
    f.el.style.strokeDasharray='0 99999';
    f.el.setAttribute('stroke','none');
    f.el.removeAttribute('filter');
  });
  activeFlows=[];
  clonedEls.forEach(function(el){if(el.parentNode)el.parentNode.removeChild(el);});
  clonedEls=[];
}

/* ── 单次动画周期 ──
   供电方虚线从节点滑到中心，
   用电方虚线在供电方到达中心时从中心滑向用电方，
   全部到达终点后暂停，再自动重播 */
function runCycle(paths,lens){
  if(!selected||moduleData[selected]===0) return;
  activeFlows.forEach(function(f){ if(f.anim) f.anim.pause(); });
  activeFlows=[];
  currentColor=providerColors[selected]||'#16AAAF';
  updateGlowColor(currentColor);

  var pG=paths[0].g, L_p=lens[pG];
  var pTravel=Math.ceil((L_p+2*D)/SPD);
  // 供电方虚线前缘到达中心(路径终点)的时刻
  var tCenter=L_p/SPD;
  // 用电方统一的延迟 = 供电方到达中心时刻 - 用电方虚线尾部进入中心所需时间
  // 加 60ms 重叠补偿，确保中心过渡无间隙
  var cDelay=Math.max(0,Math.round((L_p-D)/SPD-60));

  // 供电方
  var pFl=setupPath(paths[0]);
  pFl.style.strokeDashoffset=D;
  activeFlows.push({el:pFl,anim:anime({
    targets:pFl,strokeDashoffset:-(L_p+D),
    duration:pTravel,easing:'linear'
  })});

  // 各用电方
  for(var i=1;i<paths.length;i++){
    (function(p){
      var cG=p.g, L_c=lens[cG];
      var cTravel=Math.ceil((L_c+2*D)/SPD);
      var fl=setupPath(p);
      fl.style.strokeDashoffset=-(L_c+D);
      activeFlows.push({el:fl,anim:anime({
        targets:fl,strokeDashoffset:D,
        duration:cTravel,delay:cDelay,easing:'linear'
      })});
    })(paths[i]);
  }

  // 周期时长 = 最大结束时间 + 暂停
  var maxEnd=pTravel;
  for(var j=1;j<paths.length;j++){
    var L_c2=lens[paths[j].g];
    var ct2=Math.ceil((L_c2+2*D)/SPD);
    if(cDelay+ct2>maxEnd) maxEnd=cDelay+ct2;
  }
  var tid=setTimeout(function(){runCycle(paths,lens);},maxEnd+10);
  pendingTimers.push(tid);
}

function selectModule(mid){
  if(selected===mid){deselect();return;}
  deselect();
  selected=mid;
  var bg=findBg(mid);
  if(bg) bg.setAttribute('filter','url(#shadow-active)');
  restartFlow();
}

function isConsumerMode(mid){
  if(mid==='L3'||mid==='R3') return true;
  return moduleData[mid]<0;
}

function restartFlow(){
  if(!selected) return;
  stopAllFlows();
  var mid=selected;

  if(isConsumerMode(mid)){
    var flows=consumerFlows[mid];
    if(!flows||!flows.length){dimInactive([mid]);hint.textContent='';return;}
    var activeIds=[mid];
    flows.forEach(function(f){if(moduleData[f.prov]>0&&activeIds.indexOf(f.prov)===-1)activeIds.push(f.prov);});
    dimInactive(activeIds);
    if(moduleData[mid]===0||activeIds.length<=1){hint.textContent='数值为0';return;}
    runConsumerCycle(mid);
    hint.textContent='电流流动中';
    return;
  }

  var paths=flowMap[mid];
  if(!paths||!paths.length){dimInactive([mid]);hint.textContent='';return;}

  // 过滤：只保留数值为负的用电方路径
  var fp=[paths[0]];
  for(var fi=1;fi<paths.length;fi++){
    var tm=pathGroupToModule[paths[fi].g];
    if(tm&&moduleData[tm]<0) fp.push(paths[fi]);
  }
  var activeIds=[mid];
  fp.forEach(function(p){var m=pathGroupToModule[p.g];if(m&&activeIds.indexOf(m)===-1)activeIds.push(m);});
  dimInactive(activeIds);

  if(moduleData[mid]===0||fp.length<=1){hint.textContent='数值为0';return;}
  var lens={};
  fp.forEach(function(p){lens[p.g]=groups[p.g].querySelector('.fl').getTotalLength();});
  runCycle(fp,lens);
  hint.textContent='电流流动中';
}

var modulePathGroup={'L1':'fg-top-l','L2':'fg-mid-l','L3':'fg-bot-l','R1':'fg-top-r','R2':'fg-mid-r','R3':'fg-bot-r'};
function autoFlow(){
  if(selected) return;
  stopAllFlows();
  restoreOpacity();
  grpIds.forEach(function(id){groups[id].setAttribute('opacity','0');});

  // 找出所有供电方（正数）和用电方（负数）
  var providers=[],consumers=[];
  allModules.forEach(function(mid){
    if(moduleData[mid]>0&&flowMap[mid]&&flowMap[mid].length) providers.push(mid);
    if(moduleData[mid]<0&&consumerFlows[mid]) consumers.push(mid);
  });
  if(!providers.length||!consumers.length){hint.textContent='点击设备模块查看电流流向';return;}

  restoreOpacity();
  hint.textContent='能量自动流向';

  var maxPEnd=0,minArrival=Infinity;

  // 每个供电方用自己的颜色流向中心
  providers.forEach(function(provMid){
    var color=providerColors[provMid];
    if(!color) return;
    var providerPath=flowMap[provMid][0];
    var pGrp=groups[providerPath.g];
    if(!pGrp) return;
    var pFl=pGrp.querySelector('.fl');
    pGrp.setAttribute('opacity','1');
    pFl.setAttribute('stroke',color);
    pFl.setAttribute('stroke-opacity','0.6');
    pFl.setAttribute('stroke-width','4');
    pFl.setAttribute('filter','url(#'+getGlowFilterId(color,providerPath.g.indexOf('mid')>-1)+')');
    pFl.style.strokeDasharray=D+' 99999';
    var L_p=pFl.getTotalLength();
    var pTravel=Math.ceil((L_p+2*D)/SPD);
    pFl.style.strokeDashoffset=D;
    activeFlows.push({el:pFl,anim:anime({targets:pFl,strokeDashoffset:-(L_p+D),duration:pTravel,easing:'linear'})});
    if(pTravel>maxPEnd) maxPEnd=pTravel;
    var arrival=Math.max(0,(L_p-D)/SPD-40);
    if(arrival<minArrival) minArrival=arrival;
  });

  // 用电方颜色：单供电方用供电方颜色，多供电方用紫色
  var consumerColor=providers.length===1?providerColors[providers[0]]:'#794EAD';
  var cDelay=Math.round(minArrival);
  consumers.forEach(function(conMid){
    var cG=modulePathGroup[conMid];
    if(!cG) return;
    var cGrp=groups[cG];
    var cFl=cGrp.querySelector('.fl');
    var L_c=cFl.getTotalLength();
    var cTravel=Math.ceil((L_c+2*D)/SPD);
    cGrp.setAttribute('opacity','1');
    cFl.setAttribute('stroke',consumerColor);
    cFl.setAttribute('stroke-opacity','0.6');
    cFl.setAttribute('stroke-width','4');
    cFl.setAttribute('filter','url(#'+getGlowFilterId(consumerColor,cG.indexOf('mid')>-1)+')');
    cFl.style.strokeDasharray=D+' 99999';
    cFl.style.strokeDashoffset=-(L_c+D);
    activeFlows.push({el:cFl,anim:anime({targets:cFl,strokeDashoffset:D,duration:cTravel,delay:cDelay,easing:'linear'})});
    var totalEnd=cDelay+cTravel;
    if(totalEnd>maxPEnd) maxPEnd=totalEnd;
  });

  var tid=setTimeout(function(){autoFlow();},maxPEnd+10);
  pendingTimers.push(tid);
}

function deselect(){
  stopAllFlows();
  if(selected){var bg=findBg(selected);if(bg)bg.removeAttribute('filter');}
  restoreOpacity();
  grpIds.forEach(function(id){groups[id].setAttribute('opacity','0');});
  selected=null;
  autoFlow();
}

for(var i=0;i<hitRects.length;i++){
  (function(hit){
    var mid=hit.getAttribute('data-module');
    hit.addEventListener('click',function(){selectModule(mid);});
    hit.addEventListener('mouseenter',function(){
      if(selected===mid) return;
      var bg=findBg(mid);if(bg) bg.setAttribute('filter','url(#shadow-hover)');
    });
    hit.addEventListener('mouseleave',function(){
      if(selected===mid) return;
      var bg=findBg(mid);if(bg) bg.removeAttribute('filter');
    });
  })(hitRects[i]);
}

// ── 数据模型 & 滑块 ──
var EFF=0.87;
var moduleData={L1:0,L2:0,L3:0,R1:0,R2:0,R3:0};
var displayTexts={},realTexts={};
allModules.forEach(function(mid){
  var card=document.querySelector('.card[data-card="'+mid+'"]');
  if(!card) return;
  var texts=card.querySelectorAll('text');
  for(var i=0;i<texts.length;i++){
    var t=texts[i].textContent;
    if(t==='3.9kW') displayTexts[mid]=texts[i];
    if(t==='Real: 4.1kW') realTexts[mid]=texts[i];
  }
});

function updateCardText(mid){
  var real=moduleData[mid];
  var disp=parseFloat((real*EFF).toFixed(1));
  if(displayTexts[mid]) displayTexts[mid].textContent=disp+'kW';
  if(realTexts[mid]) realTexts[mid].textContent='Real: '+parseFloat(real.toFixed(1))+'kW';
}
var sliderRanges={L1:[0,216],L2:[-216,216],L3:[-216,0],R1:[-216,216],R2:[-216,216],R3:[-216,0]};
function updatePvSurplus(){
  var fakeR2=moduleData['R2']*EFF;
  var el=document.getElementById('pv-surplus');
  if(!el) return;
  el.setAttribute('opacity',fakeR2>0?'1':'0');
  if(fakeR2>0&&displayTexts['R2']){
    var w=displayTexts['R2'].getComputedTextLength();
    el.setAttribute('x',Math.round(748+w+8));
  }
}
function updateSliderBg(sl,mid){
  var v=parseFloat(sl.value);
  var rng=432,zeroPct=50;
  var valPct=((v+216)/rng)*100;
  var range=sliderRanges[mid];
  var aMin=((range[0]+216)/rng)*100;
  var aMax=((range[1]+216)/rng)*100;
  var fillL=Math.min(zeroPct,valPct),fillR=Math.max(zeroPct,valPct);
  var p=[];
  if(aMin>0){p.push('rgba(224,224,224,0.5) 0%','rgba(224,224,224,0.5) '+aMin+'%');}
  if(fillL>aMin){p.push('#E0E0E0 '+aMin+'%','#E0E0E0 '+fillL+'%');}
  p.push('#16AAAF '+fillL+'%','#16AAAF '+fillR+'%');
  if(fillR<aMax){p.push('#E0E0E0 '+fillR+'%','#E0E0E0 '+aMax+'%');}
  if(aMax<100){p.push('rgba(224,224,224,0.5) '+aMax+'%','rgba(224,224,224,0.5) 100%');}
  sl.style.background='linear-gradient(to right,'+p.join(',')+')';
}

allModules.forEach(function(mid){
  var slider=document.getElementById('sl-'+mid);
  var numInput=document.getElementById('si-'+mid);
  var realSpan=document.getElementById('sr-'+mid);
  if(!slider||!numInput) return;
  function syncFromReal(real,prevReal){
    moduleData[mid]=real;
    var disp=parseFloat((real*EFF).toFixed(1));
    numInput.value=disp;
    if(realSpan) realSpan.textContent=parseFloat(real.toFixed(1));
    updateCardText(mid);
    updateSliderBg(slider,mid);
    updatePvSurplus();
    if(prevReal*real<=0&&prevReal!==real){
      if(selected) restartFlow();
      else autoFlow();
    }
  }
  slider.addEventListener('input',function(){
    var range=sliderRanges[mid];
    var raw=Math.max(range[0],Math.min(range[1],parseInt(this.value)));
    this.value=raw;
    var real=parseFloat((raw/10).toFixed(1));
    syncFromReal(real,moduleData[mid]);
  });
  numInput.addEventListener('change',function(){
    var fake=parseFloat(this.value)||0;
    var range=sliderRanges[mid];
    var real=parseFloat((fake/EFF).toFixed(1));
    real=Math.max(range[0]/10,Math.min(range[1]/10,real));
    real=parseFloat(real.toFixed(1));
    slider.value=Math.round(real*10);
    syncFromReal(real,moduleData[mid]);
  });
  updateCardText(mid);
  numInput.value='0.0';
  if(realSpan) realSpan.textContent='0.0';
  updateSliderBg(slider,mid);
  updatePvSurplus();
  });
  autoFlow();
})();</script>
